<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>"/>
  <title>Reportería de Herramientas</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#FDFCF0;
      --surface:#ffffff;
      --surface-alt:#FAFAFA;
      --surface-highlight:#FFFEFB;
      --text:#374151;
      --text-strong:#1F2937;
      --text-muted:#6B7280;
      --text-subtle:#9CA3AF;
      --text-empty:#D1D5DB;
      --border:#E5E7EB;
      --border-soft:#F3F4F6;
      --accent:#C4B5FD;
      --dot-empty:#D1D5DB;
      --dot-filled:#10B981;
      --badge-bg:#ffffff;
      --badge-news-bg:#D1FAE5;
      --badge-news-text:#065F46;
      --header-gradient:linear-gradient(135deg,#E3F2FD,#F3E5F5);
      --icon-gradient:linear-gradient(135deg,#E3F2FD,#F3E5F5);
      --shadow-card:0 2px 12px rgba(0,0,0,0.05);
      --shadow-soft:0 2px 8px rgba(0,0,0,0.04);
      --btn-bg:#ffffff;
      --btn-hover-bg:#FAFAFA;
      --btn-primary-bg:#374151;
      --btn-primary-text:#ffffff;
    }
    html[data-theme="dark"]{
      --bg:#0F172A;
      --surface:#1E293B;
      --surface-alt:#162032;
      --surface-highlight:#243047;
      --text:#E5E7EB;
      --text-strong:#F9FAFB;
      --text-muted:#9CA3AF;
      --text-subtle:#6B7280;
      --text-empty:#4B5563;
      --border:#334155;
      --border-soft:#243047;
      --accent:#8B5CF6;
      --dot-empty:#4B5563;
      --dot-filled:#10B981;
      --badge-bg:#243047;
      --badge-news-bg:#064E3B;
      --badge-news-text:#A7F3D0;
      --header-gradient:linear-gradient(135deg,#1E3A8A33,#6B21A833);
      --icon-gradient:linear-gradient(135deg,#1E3A8A66,#6B21A866);
      --shadow-card:0 2px 12px rgba(0,0,0,0.35);
      --shadow-soft:0 2px 8px rgba(0,0,0,0.25);
      --btn-bg:#1E293B;
      --btn-hover-bg:#243047;
      --btn-primary-bg:#8B5CF6;
      --btn-primary-text:#ffffff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 24px 64px;transition:background .2s,color .2s}
    .container{max-width:1200px;margin:0 auto}

    /* Header */
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
    .title-block{display:flex;align-items:center;gap:14px}
    .title-icon{width:48px;height:48px;background:var(--icon-gradient);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    h1{font-size:1.45rem;font-weight:800;color:var(--text)}
    .actions{display:flex;gap:10px;align-items:center}
    .btn{padding:9px 18px;background:var(--btn-bg);border:1.5px solid var(--border);border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.78rem;font-weight:700;color:var(--text);cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn:hover{border-color:var(--accent);background:var(--btn-hover-bg)}
    .btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:var(--btn-primary-bg)}
    .btn.primary:hover{background:var(--text-strong);border-color:var(--text-strong)}
    .btn.icon-only{padding:9px 12px;font-size:0.95rem;line-height:1}

    /* Tabs */
    .tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
    .tab{padding:10px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:700;color:var(--text-muted);cursor:pointer;transition:all .2s}
    .tab:hover{border-color:var(--accent)}
    .tab.active{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:var(--btn-primary-bg)}
    .tab .empty-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dot-empty);margin-left:6px;vertical-align:middle}
    .tab .filled-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dot-filled);margin-left:6px;vertical-align:middle}

    /* Summary bar */
    .summary{background:var(--surface);border-radius:16px;padding:16px 22px;margin-bottom:24px;display:flex;gap:28px;flex-wrap:wrap;box-shadow:var(--shadow-soft)}
    .summary-item{display:flex;flex-direction:column;gap:2px}
    .summary-label{font-size:0.7rem;font-weight:700;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em}
    .summary-value{font-size:1.05rem;font-weight:800;color:var(--text)}

    /* Team cards */
    .teams{display:flex;flex-direction:column;gap:18px}
    .team{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-card)}
    .team-header{padding:16px 22px;background:var(--header-gradient);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
    .team-name{font-size:0.95rem;font-weight:800;color:var(--text);letter-spacing:0.02em}
    .team-meta{display:flex;gap:10px;align-items:center}
    .badge{padding:4px 12px;background:var(--badge-bg);border-radius:50px;font-size:0.7rem;font-weight:700;color:var(--text-muted)}
    .badge.has-news{background:var(--badge-news-bg);color:var(--badge-news-text)}
    .chevron{transition:transform .2s;font-size:0.9rem;color:var(--text-muted)}
    .team.collapsed .chevron{transform:rotate(-90deg)}
    .team.collapsed .team-body{display:none}

    /* Tools table */
    .team-body{padding:0}
    .tool-row{display:grid;grid-template-columns:1.1fr 1.5fr 1.5fr 1.5fr 1fr 1.5fr;border-top:1px solid var(--border-soft);font-size:0.82rem}
    .tool-row.head{background:var(--surface-alt);font-weight:700;color:var(--text-subtle);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em}
    .tool-row .cell{padding:12px 16px;border-right:1px solid var(--border-soft);word-break:break-word}
    .tool-row .cell:last-child{border-right:none}
    .tool-row.empty{color:var(--text-empty);font-style:italic}
    .tool-row .tool-name{font-weight:700;color:var(--text)}
    .tool-row.has-data .tool-name{color:var(--text-strong)}
    .tool-row.has-data{background:var(--surface-highlight)}
    .cell-empty{color:var(--text-empty);font-size:0.78rem}

    /* Empty state */
    .empty-state{background:var(--surface);border-radius:18px;padding:48px 24px;text-align:center;box-shadow:var(--shadow-card)}
    .empty-state .icon{font-size:2.5rem;margin-bottom:12px}
    .empty-state h2{font-size:1rem;font-weight:800;color:var(--text);margin-bottom:6px}
    .empty-state p{font-size:0.85rem;color:var(--text-subtle)}

    /* Loading */
    .loading{text-align:center;padding:60px 20px;color:var(--text-subtle);font-size:0.9rem;font-weight:600}
    .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Controls bar */
    .controls{background:var(--surface);border-radius:16px;padding:14px 18px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow-soft)}
    .controls .search{flex:1 1 220px;min-width:180px;position:relative}
    .controls .search input{width:100%;padding:9px 16px 9px 36px;border:1.5px solid var(--border);border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:600;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s}
    .controls .search input:focus{border-color:var(--accent)}
    .controls .search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:0.8rem;opacity:.6;pointer-events:none}
    /* Custom dropdown */
    .dropdown{position:relative}
    .dropdown-trigger{padding:9px 36px 9px 16px;border:1.5px solid var(--border);border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.78rem;font-weight:700;color:var(--text);background:var(--bg);outline:none;cursor:pointer;transition:border-color .2s;display:inline-flex;align-items:center;gap:6px;position:relative;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
    .dropdown-trigger:hover{border-color:var(--accent)}
    .dropdown.open .dropdown-trigger{border-color:var(--accent)}
    .dropdown-trigger::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:1.8px solid var(--text-muted);border-bottom:1.8px solid var(--text-muted);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
    .dropdown.open .dropdown-trigger::after{transform:translateY(-30%) rotate(-135deg)}
    .dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;max-width:300px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow-card);padding:6px;z-index:50;display:none;max-height:280px;overflow-y:auto}
    .dropdown.open .dropdown-panel{display:block}
    .dropdown-option{padding:8px 14px;border-radius:10px;font-family:'Nunito',sans-serif;font-size:0.78rem;font-weight:700;color:var(--text);cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dropdown-option:hover{background:var(--btn-hover-bg)}
    .dropdown-option.selected{background:var(--btn-primary-bg);color:var(--btn-primary-text)}
    .dropdown-option.selected:hover{background:var(--btn-primary-bg)}
    .btn.toggle{background:var(--btn-bg)}
    .btn.toggle.active{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:var(--btn-primary-bg)}
    .view-switch{display:inline-flex;background:var(--bg);border:1.5px solid var(--border);border-radius:50px;padding:3px;gap:2px}
    .view-switch button{padding:6px 14px;background:transparent;border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.74rem;font-weight:700;color:var(--text-muted);cursor:pointer;transition:all .2s}
    .view-switch button.active{background:var(--btn-primary-bg);color:var(--btn-primary-text)}

    /* Risks view */
    .risks-list{display:flex;flex-direction:column;gap:14px}
    .risk-card{background:var(--surface);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow-card);border-left:4px solid #DC2626}
    html[data-theme="dark"] .risk-card{border-left-color:#F87171}
    .risk-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    .risk-tool{font-size:1rem;font-weight:800;color:var(--text-strong)}
    .risk-team{font-size:0.7rem;font-weight:700;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em}
    .risk-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 22px;font-size:0.82rem}
    .risk-field{display:flex;flex-direction:column;gap:3px}
    .risk-label{font-size:0.65rem;font-weight:700;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em}
    .risk-value{color:var(--text);word-break:break-word}
    .risk-value.muted{color:var(--text-empty);font-style:italic}

    /* Footer info */
    .footer-info{margin-top:32px;text-align:center;font-size:0.72rem;color:var(--text-subtle);font-weight:600}

    /* Mobile */
    @media (max-width: 860px){
      body{padding:20px 12px 48px}
      .tool-row{grid-template-columns:1fr;font-size:0.85rem}
      .tool-row .cell{border-right:none;border-bottom:1px solid var(--border-soft);padding:10px 14px}
      .tool-row.head{display:none}
      .tool-row .cell::before{content:attr(data-label);display:block;font-size:0.65rem;font-weight:700;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px}
      .tool-row{padding:6px 0}
      h1{font-size:1.2rem}
    }
  </style>
  <script>
    (function(){
      const saved = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', saved || 'light');
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="title-icon">📋</div>
        <h1>Reportería de Herramientas</h1>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="btn">↻ Actualizar</button>
        <button id="themeBtn" class="btn icon-only" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
        <a href="/logout" class="btn">Salir</a>
      </div>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Cargando novedades...</div>
      </div>
    </div>

    <div class="footer-info" id="footerInfo"></div>
  </div>

<script>
let DATA = null;
let activeBimestre = null;
let searchTerm = '';
let teamFilter = '';
let responsableFilter = '';
let onlyNews = false;
let viewMode = 'teams'; // 'teams' | 'risks'

const HEADERS = [
  { key: 'herramienta',   label: 'Herramienta' },
  { key: 'queCambio',     label: 'Qué cambió' },
  { key: 'nuevaPolitica', label: 'Nueva política / actualización' },
  { key: 'deficiencia',   label: 'Deficiencia / riesgo' },
  { key: 'responsable',   label: 'Responsable' },
  { key: 'proximoPaso',   label: 'Próximo paso' },
];

async function load(refresh = false) {
  if (refresh) {
    await fetch('/api/refresh', { method: 'POST' });
  }
  document.getElementById('content').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Cargando novedades...</div>
    </div>`;
  try {
    const r = await fetch('/api/novedades');
    if (!r.ok) throw new Error('Error al cargar');
    DATA = await r.json();
    // Pick most recent bimestre with data, fallback to last
    if (!activeBimestre) {
      const withData = DATA.bimestres.filter(b => hasAnyNews(b));
      activeBimestre = (withData.length ? withData[withData.length - 1] : DATA.bimestres[0])?.id;
    }
    render();
  } catch (err) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <h2>No se pudo cargar la información</h2>
        <p>${err.message}</p>
      </div>`;
  }
}

function hasNews(tool) {
  return !!(tool.queCambio || tool.nuevaPolitica || tool.deficiencia || tool.responsable || tool.proximoPaso);
}
function hasAnyNews(bimestre) {
  return (bimestre.teams || []).some(t => (t.tools || []).some(hasNews));
}
function countNews(bimestre) {
  let n = 0;
  (bimestre.teams || []).forEach(t => (t.tools || []).forEach(tool => { if (hasNews(tool)) n++; }));
  return n;
}

function getFilteredTeams(bimestre) {
  const term = searchTerm.trim().toLowerCase();
  return (bimestre.teams || [])
    .map(team => {
      if (teamFilter && team.name !== teamFilter) return null;
      const tools = team.tools.filter(tool => {
        if (onlyNews && !hasNews(tool)) return false;
        if (responsableFilter && tool.responsable !== responsableFilter) return false;
        if (term && !tool.herramienta.toLowerCase().includes(term)) return false;
        return true;
      });
      if (tools.length === 0) return null;
      return { ...team, tools };
    })
    .filter(Boolean);
}

function getRisks(bimestre) {
  const term = searchTerm.trim().toLowerCase();
  const risks = [];
  (bimestre.teams || []).forEach(team => {
    if (teamFilter && team.name !== teamFilter) return;
    team.tools.forEach(tool => {
      if (!tool.deficiencia) return;
      if (responsableFilter && tool.responsable !== responsableFilter) return;
      if (term && !tool.herramienta.toLowerCase().includes(term)) return;
      risks.push({ team: team.name, ...tool });
    });
  });
  return risks;
}

function uniqueValues(bimestre, key) {
  const set = new Set();
  (bimestre.teams || []).forEach(team => {
    team.tools.forEach(tool => {
      const v = key === 'team' ? team.name : tool[key];
      if (v) set.add(v);
    });
  });
  return [...set].sort();
}

function render() {
  const bimestre = DATA.bimestres.find(b => b.id === activeBimestre) || DATA.bimestres[0];

  const tabsHTML = DATA.bimestres.map(b => {
    const filled = hasAnyNews(b);
    return `<button class="tab ${b.id === activeBimestre ? 'active' : ''}" data-id="${b.id}">
      ${b.label}<span class="${filled ? 'filled-dot' : 'empty-dot'}"></span>
    </button>`;
  }).join('');

  const totalTools = (bimestre.teams || []).reduce((s, t) => s + (t.tools || []).length, 0);
  const totalNews  = countNews(bimestre);
  const totalTeams = (bimestre.teams || []).length;
  const totalRisks = getRisks({ ...bimestre, teams: bimestre.teams || [] }).length;

  const summaryHTML = `
    <div class="summary">
      <div class="summary-item"><span class="summary-label">Bimestre</span><span class="summary-value">${escapeHTML(bimestre.label)}</span></div>
      <div class="summary-item"><span class="summary-label">Equipos</span><span class="summary-value">${totalTeams}</span></div>
      <div class="summary-item"><span class="summary-label">Herramientas</span><span class="summary-value">${totalTools}</span></div>
      <div class="summary-item"><span class="summary-label">Con novedades</span><span class="summary-value">${totalNews}</span></div>
      <div class="summary-item"><span class="summary-label">Riesgos detectados</span><span class="summary-value">${(bimestre.teams || []).reduce((s,t)=>s+t.tools.filter(x=>x.deficiencia).length,0)}</span></div>
    </div>`;

  const teamOptions = uniqueValues(bimestre, 'team');
  const respOptions = uniqueValues(bimestre, 'responsable');

  const controlsHTML = `
    <div class="controls">
      <div class="view-switch">
        <button data-view="teams" class="${viewMode === 'teams' ? 'active' : ''}">Por equipos</button>
        <button data-view="risks" class="${viewMode === 'risks' ? 'active' : ''}">Riesgos</button>
      </div>
      <div class="search"><input type="text" id="searchInput" placeholder="Buscar herramienta..." value="${escapeHTML(searchTerm)}"/></div>
      ${renderDropdown('teamDropdown', teamFilter, 'Todos los equipos', teamOptions)}
      ${renderDropdown('respDropdown', responsableFilter, 'Todos los responsables', respOptions)}
      ${viewMode === 'teams' ? `<button id="onlyNewsBtn" class="btn toggle ${onlyNews ? 'active' : ''}">Solo novedades</button>` : ''}
      <button id="exportBtn" class="btn">↓ Exportar</button>
    </div>`;

  let bodyHTML;
  if (bimestre.error) {
    bodyHTML = `<div class="empty-state"><div class="icon">⚠️</div><h2>Error cargando esta hoja</h2><p>${escapeHTML(bimestre.error)}</p></div>`;
  } else if (!bimestre.teams || bimestre.teams.length === 0) {
    bodyHTML = `<div class="empty-state"><div class="icon">📭</div><h2>Sin datos</h2><p>No se encontraron equipos en este bimestre.</p></div>`;
  } else if (viewMode === 'risks') {
    const risks = getRisks(bimestre);
    bodyHTML = risks.length
      ? `<div class="risks-list">${risks.map(renderRisk).join('')}</div>`
      : `<div class="empty-state"><div class="icon">✅</div><h2>Sin riesgos detectados</h2><p>No hay deficiencias cargadas que coincidan con los filtros.</p></div>`;
  } else {
    const teams = getFilteredTeams(bimestre);
    bodyHTML = teams.length
      ? `<div class="teams">${teams.map(renderTeam).join('')}</div>`
      : `<div class="empty-state"><div class="icon">🔍</div><h2>Sin resultados</h2><p>Ninguna herramienta coincide con los filtros aplicados.</p></div>`;
  }

  document.getElementById('content').innerHTML = tabsHTML.length
    ? `<div class="tabs">${tabsHTML}</div>${summaryHTML}${controlsHTML}${bodyHTML}`
    : bodyHTML;

  wireUpEvents();

  const fetched = DATA.fetchedAt ? new Date(DATA.fetchedAt).toLocaleString('es-AR') : '—';
  document.getElementById('footerInfo').textContent = `Datos actualizados: ${fetched}`;
}

function renderDropdown(id, selectedValue, placeholder, options) {
  const label = selectedValue || placeholder;
  const optionsHTML = [
    `<div class="dropdown-option ${selectedValue === '' ? 'selected' : ''}" data-value="">${escapeHTML(placeholder)}</div>`,
    ...options.map(o => `<div class="dropdown-option ${o === selectedValue ? 'selected' : ''}" data-value="${escapeHTML(o)}">${escapeHTML(o)}</div>`)
  ].join('');
  return `<div class="dropdown" id="${id}">
    <button type="button" class="dropdown-trigger" title="${escapeHTML(label)}">${escapeHTML(label)}</button>
    <div class="dropdown-panel">${optionsHTML}</div>
  </div>`;
}

function wireDropdown(id, onSelect) {
  const root = document.getElementById(id);
  if (!root) return;
  const trigger = root.querySelector('.dropdown-trigger');
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    const wasOpen = root.classList.contains('open');
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
    if (!wasOpen) root.classList.add('open');
  });
  root.querySelectorAll('.dropdown-option').forEach(opt => {
    opt.addEventListener('click', e => {
      e.stopPropagation();
      root.classList.remove('open');
      onSelect(opt.dataset.value);
    });
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
});

function wireUpEvents() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { activeBimestre = t.dataset.id; render(); });
  });
  document.querySelectorAll('.team-header').forEach(h => {
    h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
  });
  document.querySelectorAll('.view-switch button').forEach(b => {
    b.addEventListener('click', () => { viewMode = b.dataset.view; render(); });
  });
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', e => {
      searchTerm = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const newInput = document.getElementById('searchInput');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(pos, pos); }
    });
  }
  wireDropdown('teamDropdown', v => { teamFilter = v; render(); });
  wireDropdown('respDropdown', v => { responsableFilter = v; render(); });
  const onlyNewsBtn = document.getElementById('onlyNewsBtn');
  if (onlyNewsBtn) onlyNewsBtn.addEventListener('click', () => { onlyNews = !onlyNews; render(); });
  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.addEventListener('click', exportMarkdown);
}

function renderRisk(risk) {
  const field = (label, value) => `
    <div class="risk-field">
      <span class="risk-label">${label}</span>
      <span class="risk-value ${value ? '' : 'muted'}">${value ? escapeHTML(value) : '—'}</span>
    </div>`;
  return `<div class="risk-card">
    <div class="risk-head">
      <span class="risk-tool">${escapeHTML(risk.herramienta)}</span>
      <span class="risk-team">${escapeHTML(risk.team)}</span>
    </div>
    <div class="risk-body">
      ${field('Deficiencia / riesgo', risk.deficiencia)}
      ${field('Próximo paso', risk.proximoPaso)}
      ${field('Responsable', risk.responsable)}
      ${field('Qué cambió', risk.queCambio)}
    </div>
  </div>`;
}

function exportMarkdown() {
  const bimestre = DATA.bimestres.find(b => b.id === activeBimestre) || DATA.bimestres[0];
  const lines = [];
  lines.push(`# Reportería de Herramientas — ${bimestre.label}`);
  lines.push('');
  lines.push(`_Generado: ${new Date().toLocaleString('es-AR')}_`);
  lines.push('');

  if (viewMode === 'risks') {
    const risks = getRisks(bimestre);
    lines.push(`## Riesgos detectados (${risks.length})`);
    lines.push('');
    if (!risks.length) {
      lines.push('_Sin riesgos cargados._');
    } else {
      risks.forEach(r => {
        lines.push(`### ${r.herramienta} — _${r.team}_`);
        if (r.deficiencia)   lines.push(`- **Deficiencia / riesgo:** ${r.deficiencia}`);
        if (r.proximoPaso)   lines.push(`- **Próximo paso:** ${r.proximoPaso}`);
        if (r.responsable)   lines.push(`- **Responsable:** ${r.responsable}`);
        if (r.queCambio)     lines.push(`- **Qué cambió:** ${r.queCambio}`);
        lines.push('');
      });
    }
  } else {
    const teams = getFilteredTeams(bimestre);
    if (!teams.length) {
      lines.push('_Sin herramientas que coincidan con los filtros._');
    } else {
      teams.forEach(team => {
        lines.push(`## ${team.name}`);
        lines.push('');
        team.tools.forEach(tool => {
          lines.push(`### ${tool.herramienta}`);
          if (tool.queCambio)     lines.push(`- **Qué cambió:** ${tool.queCambio}`);
          if (tool.nuevaPolitica) lines.push(`- **Nueva política / actualización:** ${tool.nuevaPolitica}`);
          if (tool.deficiencia)   lines.push(`- **Deficiencia / riesgo:** ${tool.deficiencia}`);
          if (tool.responsable)   lines.push(`- **Responsable:** ${tool.responsable}`);
          if (tool.proximoPaso)   lines.push(`- **Próximo paso:** ${tool.proximoPaso}`);
          if (!hasNews(tool))     lines.push('_Sin novedades cargadas._');
          lines.push('');
        });
      });
    }
  }

  const md = lines.join('\n');
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = bimestre.label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  a.href = url;
  a.download = `reporteria-${safeName}${viewMode === 'risks' ? '-riesgos' : ''}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderTeam(team) {
  const toolsWithNews = team.tools.filter(hasNews).length;
  const collapsedClass = toolsWithNews === 0 ? 'collapsed' : '';
  const badge = toolsWithNews > 0
    ? `<span class="badge has-news">${toolsWithNews} con novedades</span>`
    : `<span class="badge">sin novedades</span>`;

  const headRow = `<div class="tool-row head">
    ${HEADERS.map(h => `<div class="cell">${h.label}</div>`).join('')}
  </div>`;

  const rows = team.tools.length
    ? team.tools.map(tool => {
        const has = hasNews(tool);
        return `<div class="tool-row ${has ? 'has-data' : 'empty'}">
          ${HEADERS.map(h => {
            const v = tool[h.key];
            const display = v ? escapeHTML(v) : `<span class="cell-empty">—</span>`;
            const cls = h.key === 'herramienta' ? 'cell tool-name' : 'cell';
            return `<div class="${cls}" data-label="${h.label}">${display}</div>`;
          }).join('')}
        </div>`;
      }).join('')
    : `<div class="tool-row empty"><div class="cell" style="grid-column:1/-1;text-align:center">Sin herramientas listadas</div></div>`;

  return `<div class="team ${collapsedClass}">
    <div class="team-header">
      <span class="team-name">${escapeHTML(team.name)}</span>
      <div class="team-meta">
        ${badge}
        <span class="badge">${team.tools.length} herramientas</span>
        <span class="chevron">▼</span>
      </div>
    </div>
    <div class="team-body">
      ${headRow}
      ${rows}
    </div>
  </div>`;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('refreshBtn').addEventListener('click', () => load(true));

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon();
});
updateThemeIcon();

load();
</script>
</body>
