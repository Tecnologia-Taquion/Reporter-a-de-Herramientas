<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>"/>
  <title>Líderes — Reportería de Herramientas</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    /* Design system: Minimalism & Swiss Style + Remote Work palette (ui-ux-pro-max).
       Indigo primary + Emerald CTA + neutros grises. */
    :root{
      --bg:#FAFAFA;
      --surface:#ffffff;
      --surface-alt:#F9FAFB;
      --text:#374151;
      --text-strong:#111827;
      --text-muted:#6B7280;
      --text-subtle:#9CA3AF;
      --text-empty:#D1D5DB;
      --border:#E5E7EB;
      --border-soft:#F3F4F6;
      --accent:#6366F1;
      --accent-hover:#4F46E5;
      --accent-soft:#EEF2FF;
      --green:#10B981;
      --green-hover:#059669;
      --red:#DC2626;
      --amber:#F59E0B;
      --shadow-card:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
      --shadow-soft:0 1px 2px rgba(15,23,42,0.04);
      --shadow-md:0 4px 12px rgba(15,23,42,0.08);
      --btn-bg:#ffffff;
      --btn-hover-bg:#F9FAFB;
      --btn-primary-bg:#6366F1;
      --btn-primary-text:#ffffff;
      --btn-primary-hover:#4F46E5;
      --header-gradient:linear-gradient(135deg,#EEF2FF 0%,#F5F3FF 100%);
    }
    html[data-theme="dark"]{
      --bg:#0F172A;
      --surface:#1E293B;
      --surface-alt:#162032;
      --text:#E5E7EB;
      --text-strong:#F9FAFB;
      --text-muted:#94A3B8;
      --text-subtle:#64748B;
      --text-empty:#475569;
      --border:#334155;
      --border-soft:#243047;
      --accent:#818CF8;
      --accent-hover:#A5B4FC;
      --accent-soft:#1E1B4B;
      --green:#10B981;
      --green-hover:#34D399;
      --red:#F87171;
      --amber:#FBBF24;
      --shadow-card:0 1px 3px rgba(0,0,0,0.4),0 1px 2px rgba(0,0,0,0.2);
      --shadow-soft:0 1px 2px rgba(0,0,0,0.2);
      --shadow-md:0 4px 12px rgba(0,0,0,0.45);
      --btn-bg:#1E293B;
      --btn-hover-bg:#243047;
      --btn-primary-bg:#6366F1;
      --btn-primary-text:#ffffff;
      --btn-primary-hover:#818CF8;
      --header-gradient:linear-gradient(135deg,#1E1B4B 0%,#312E81 100%);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 24px 64px;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    .container{max-width:1100px;margin:0 auto}

    /* Focus rings consistentes (a11y) */
    :focus{outline:none}
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, .dropdown-trigger:focus-visible, .dropdown-option:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
    .tab:focus-visible{outline-offset:3px}

    /* Header */
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
    .title-block{display:flex;align-items:center;gap:14px}
    .title-icon{width:48px;height:48px;background:var(--header-gradient);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    h1{font-size:1.35rem;font-weight:800;color:var(--text)}
    .team-pill{font-size:0.72rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;display:block}
    .actions{display:flex;gap:10px;align-items:center}
    .btn{padding:9px 18px;background:var(--btn-bg);border:1.5px solid var(--border);border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.78rem;font-weight:700;color:var(--text);cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn:hover{border-color:var(--accent);background:var(--btn-hover-bg)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .btn.icon-only{padding:9px 12px;font-size:0.95rem;line-height:1}
    .btn .spin-icon{display:inline-block;animation:none}
    .btn.loading .spin-icon{animation:spin 0.7s linear infinite}
    .btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:var(--btn-primary-bg)}
    .btn.primary:hover{background:var(--btn-primary-hover);border-color:var(--btn-primary-hover)}
    .btn.green{background:var(--green);color:#fff;border-color:var(--green)}
    .btn.green:hover{background:var(--green-hover);border-color:var(--green-hover)}
    .btn.red{background:#fff;color:var(--red);border-color:#FCA5A5}
    .btn.red:hover{background:#FEF2F2}
    html[data-theme="dark"] .btn.red{background:#1E293B;color:#FCA5A5;border-color:#7F1D1D}

    /* Tabs */
    .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .tab{padding:10px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:700;color:var(--text-muted);cursor:pointer;transition:all .2s}
    .tab:hover{border-color:var(--accent)}
    .tab.active{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:var(--btn-primary-bg)}
    .tab .count{display:inline-block;background:rgba(255,255,255,0.25);padding:1px 8px;border-radius:50px;font-size:0.7rem;margin-left:6px}
    .tab:not(.active) .count{background:var(--border)}

    /* Summary */
    .summary{background:var(--surface);border-radius:16px;padding:16px 22px;margin-bottom:20px;display:flex;gap:28px;flex-wrap:wrap;box-shadow:var(--shadow-soft)}
    .summary-item{display:flex;flex-direction:column;gap:2px}
    .summary-label{font-size:0.7rem;font-weight:700;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em}
    .summary-value{font-size:1.05rem;font-weight:800;color:var(--text)}

    /* Controls */
    .controls{background:var(--surface);border-radius:16px;padding:14px 18px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow-soft)}
    .controls .search{flex:1 1 220px;min-width:180px;position:relative}
    .controls .search input{width:100%;padding:9px 16px 9px 36px;border:1.5px solid var(--border);border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:600;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s}
    .controls .search input:focus{border-color:var(--accent)}
    .controls .search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:0.8rem;opacity:.6;pointer-events:none}

    /* Suggestion cards */
    .cards{display:flex;flex-direction:column;gap:14px}
    .card{background:var(--surface);border-radius:18px;padding:20px 24px;box-shadow:var(--shadow-card);border-left:4px solid transparent}
    .card.relevancia-alta{border-left-color:var(--green)}
    .card.relevancia-media{border-left-color:var(--amber)}
    .card.relevancia-baja{border-left-color:var(--text-empty)}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:10px}
    .card-tool{font-size:1.05rem;font-weight:800;color:var(--text-strong)}
    .card-title{font-size:0.85rem;font-weight:700;color:var(--text-muted);margin-top:2px}
    .card-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .chip{font-size:0.65rem;font-weight:800;padding:3px 10px;border-radius:50px;text-transform:uppercase;letter-spacing:0.03em;line-height:1.5}
    .chip-alta{background:#D1FAE5;color:#065F46}
    .chip-media{background:#FEF3C7;color:#92400E}
    .chip-baja{background:#F3F4F6;color:#6B7280}
    html[data-theme="dark"] .chip-alta{background:#064E3B55;color:#A7F3D0}
    html[data-theme="dark"] .chip-media{background:#92400E55;color:#FDE68A}
    html[data-theme="dark"] .chip-baja{background:#37415155;color:#9CA3AF}
    .card-body{display:flex;flex-direction:column;gap:10px;font-size:0.85rem;line-height:1.5;margin-bottom:14px}
    .card-row{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
    .card-label{font-size:0.65rem;font-weight:800;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em;padding-top:3px}
    .card-value{color:var(--text);word-break:break-word}
    .card-value a{color:var(--accent);text-decoration:none}
    .card-value a:hover{text-decoration:underline}
    .card-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--border-soft);padding-top:14px}

    /* My decisions */
    .decision-card{background:var(--surface);border-radius:18px;padding:18px 22px;box-shadow:var(--shadow-card);border-left:4px solid var(--green)}
    .decision-card.rejected{border-left-color:var(--text-empty);opacity:.75}
    .decision-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .decision-tool{font-size:0.95rem;font-weight:800;color:var(--text-strong)}
    .decision-meta{font-size:0.72rem;font-weight:700;color:var(--text-subtle)}
    .decision-status{font-size:0.65rem;font-weight:800;padding:3px 10px;border-radius:50px;text-transform:uppercase;letter-spacing:0.03em}
    .decision-status.approved{background:#D1FAE5;color:#065F46}
    .decision-status.rejected{background:#FEE2E2;color:#991B1B}
    html[data-theme="dark"] .decision-status.approved{background:#064E3B55;color:#A7F3D0}
    html[data-theme="dark"] .decision-status.rejected{background:#7F1D1D55;color:#FECACA}

    /* Empty state */
    .empty-state{background:var(--surface);border-radius:18px;padding:48px 24px;text-align:center;box-shadow:var(--shadow-card)}
    .empty-state .icon{font-size:2.5rem;margin-bottom:12px}
    .empty-state h2{font-size:1rem;font-weight:800;color:var(--text);margin-bottom:6px}
    .empty-state p{font-size:0.85rem;color:var(--text-subtle)}

    /* Loading */
    .loading{text-align:center;padding:60px 20px;color:var(--text-subtle);font-size:0.9rem;font-weight:600}
    .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:32px 20px;overflow-y:auto;backdrop-filter:blur(2px)}
    .modal-backdrop.open{display:flex}
    .modal-card{background:var(--surface);border-radius:20px;max-width:680px;width:100%;box-shadow:0 25px 50px rgba(0,0,0,0.3);overflow:hidden;display:flex;flex-direction:column;margin:auto}
    .modal-header{padding:22px 28px 16px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;gap:12px}
    .modal-title{font-size:1.15rem;font-weight:800;color:var(--text-strong)}
    .modal-subtitle{font-size:0.7rem;font-weight:800;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:2px}
    .modal-close{width:36px;height:36px;background:transparent;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s}
    .modal-close:hover{background:var(--btn-hover-bg);color:var(--text)}
    .modal-body{padding:18px 28px 24px;display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:0.7rem;font-weight:800;color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em}
    .field input, .field textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:14px;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:600;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;resize:vertical;min-height:38px}
    .field textarea{min-height:70px;border-radius:18px}
    .field input:focus, .field textarea:focus{border-color:var(--accent)}

    /* Custom dropdown (reemplaza select nativo) */
    .dropdown{position:relative;width:100%}
    .dropdown-trigger{width:100%;padding:10px 36px 10px 14px;border:1.5px solid var(--border);border-radius:14px;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:600;color:var(--text);background:var(--bg);outline:none;cursor:pointer;text-align:left;display:flex;align-items:center;position:relative;transition:border-color .2s;min-height:38px}
    .dropdown-trigger:hover, .dropdown.open .dropdown-trigger{border-color:var(--accent)}
    .dropdown-trigger.placeholder{color:var(--text-subtle)}
    .dropdown-trigger::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:1.8px solid var(--text-muted);border-bottom:1.8px solid var(--text-muted);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
    .dropdown.open .dropdown-trigger::after{transform:translateY(-30%) rotate(-135deg)}
    .dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow-card);padding:6px;z-index:120;display:none;max-height:260px;overflow-y:auto}
    .dropdown.open .dropdown-panel{display:block}
    .dropdown-option{padding:8px 14px;border-radius:10px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:600;color:var(--text);cursor:pointer;transition:background .15s;line-height:1.4}
    .dropdown-option:hover{background:var(--btn-hover-bg)}
    .dropdown-option.selected{background:var(--btn-primary-bg);color:var(--btn-primary-text);font-weight:700}
    .dropdown-option.selected:hover{background:var(--btn-primary-bg)}
    .dropdown-option.placeholder{color:var(--text-subtle);font-style:italic}

    /* Header inline dropdown (variante más chica para search/filtros) */
    .controls .dropdown .dropdown-trigger{border-radius:50px;padding:9px 36px 9px 16px;font-size:0.82rem;font-weight:700;min-height:0}
    .controls .dropdown .dropdown-panel{border-radius:14px}
    .modal-footer{padding:16px 28px 22px;border-top:1px solid var(--border-soft);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

    /* Toast */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text-strong);color:var(--btn-primary-text);padding:12px 24px;border-radius:50px;font-size:0.85rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.25);opacity:0;transition:transform .3s,opacity .3s;z-index:200}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    .toast.error{background:#DC2626;color:#fff}

    /* Footer */
    .footer-info{margin-top:32px;text-align:center;font-size:0.72rem;color:var(--text-subtle);font-weight:600}

    @media (max-width: 700px){
      body{padding:20px 12px 48px}
      .card-row{grid-template-columns:1fr;gap:2px}
      .card-actions{justify-content:stretch}
      .card-actions .btn{flex:1;justify-content:center}
    }
  </style>
  <script>
    (function(){
      const saved = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', saved || 'light');
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="title-icon">👥</div>
        <div>
          <h1>Panel de Líderes</h1>
          <span class="team-pill" id="teamPill">Equipo: —</span>
        </div>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="btn"><span class="spin-icon">↻</span><span> Actualizar</span></button>
        <button id="themeBtn" class="btn icon-only" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
        <a href="/lideres/logout" class="btn">Salir</a>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="pendientes">Sugerencias pendientes<span class="count" id="countPendientes">·</span></button>
      <button class="tab" data-tab="mias">Mis decisiones<span class="count" id="countMias">·</span></button>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Cargando…</div>
      </div>
    </div>

    <div class="footer-info" id="footerInfo"></div>
  </div>

  <div class="modal-backdrop" id="editModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <span class="modal-subtitle" id="modalSubtitle">Sugerencia</span>
          <span class="modal-title" id="modalTitle">—</span>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button id="modalCancel" class="btn">Cancelar</button>
        <button id="modalApprove" class="btn green">✓ Aprobar y enviar al Sheet</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
let STATE = {
  team: null,
  pendientes: [],
  bimestres: [],
  decisiones: [],
  activeTab: 'pendientes',
  search: '',
  loaded: { pendientes: false, mias: false },
};
let MODAL = { suggestion: null };

function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 3200);
}

async function loadPendientes() {
  const r = await fetch('/api/lideres/sugerencias');
  if (r.status === 401) { window.location.href = '/lideres/login'; return; }
  if (!r.ok) throw new Error('Error cargando sugerencias');
  const data = await r.json();
  STATE.team = data.team;
  STATE.pendientes = data.pendientes || [];
  STATE.bimestres = (data.bimestres || []).sort((a, b) => a.sortKey - b.sortKey);
  STATE.herramientasMiEquipo = data.herramientasMiEquipo || [];
  STATE.loaded.pendientes = true;
}

async function loadMias() {
  const r = await fetch('/api/lideres/aprobadas');
  if (!r.ok) throw new Error('Error cargando mis decisiones');
  const data = await r.json();
  STATE.team = data.team;
  STATE.decisiones = data.decisiones || [];
  STATE.loaded.mias = true;
}

async function ensureLoaded(tab) {
  if (tab === 'pendientes' && !STATE.loaded.pendientes) await loadPendientes();
  if (tab === 'mias' && !STATE.loaded.mias) await loadMias();
}

async function init() {
  try {
    await loadPendientes();
    render();
  } catch (err) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <h2>No se pudo cargar</h2>
        <p>${escapeHTML(err.message)}</p>
      </div>`;
  }
}

function render() {
  document.getElementById('teamPill').textContent = `Equipo: ${STATE.team || '—'}`;
  document.getElementById('countPendientes').textContent = STATE.pendientes.length;
  document.getElementById('countMias').textContent = STATE.decisiones.length;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === STATE.activeTab);
  });

  if (STATE.activeTab === 'pendientes') renderPendientes();
  else renderMias();
}

function renderPendientes() {
  const term = STATE.search.trim().toLowerCase();
  const filtered = STATE.pendientes.filter(s => {
    if (!term) return true;
    return (s.herramienta + ' ' + s.titulo_original + ' ' + s.resumen).toLowerCase().includes(term);
  });

  const summaryHTML = `
    <div class="summary">
      <div class="summary-item"><span class="summary-label">Tu equipo</span><span class="summary-value">${escapeHTML(STATE.team || '—')}</span></div>
      <div class="summary-item"><span class="summary-label">Pendientes</span><span class="summary-value">${STATE.pendientes.length}</span></div>
      <div class="summary-item"><span class="summary-label">Bimestres disponibles</span><span class="summary-value">${STATE.bimestres.length}</span></div>
    </div>`;

  const controlsHTML = `
    <div class="controls">
      <div class="search"><input type="text" id="searchInput" placeholder="Buscar herramienta o texto…" value="${escapeHTML(STATE.search)}"/></div>
      <button id="manualBtn" class="btn primary">+ Agregar manualmente</button>
    </div>`;

  let body;
  if (filtered.length === 0) {
    body = STATE.pendientes.length === 0
      ? `<div class="empty-state"><div class="icon">🎉</div><h2>¡Estás al día!</h2><p>No hay sugerencias pendientes de revisar para tu equipo.</p></div>`
      : `<div class="empty-state"><div class="icon">🔍</div><h2>Sin resultados</h2><p>Ninguna sugerencia coincide con tu búsqueda.</p></div>`;
  } else {
    body = `<div class="cards">${filtered.map(renderCard).join('')}</div>`;
  }

  document.getElementById('content').innerHTML = summaryHTML + controlsHTML + body;
  wireEvents();
}

function renderCard(s) {
  const rel = (s.relevancia || 'media').toLowerCase();
  return `<div class="card relevancia-${rel}" data-hash="${escapeHTML(s._hash)}">
    <div class="card-head">
      <div>
        <div class="card-tool">${escapeHTML(s.herramienta)}</div>
        <div class="card-title">${escapeHTML(s.titulo_original)}</div>
      </div>
      <div class="card-meta">
        <span class="chip chip-${rel}">${escapeHTML(s.relevancia || 'media')}</span>
        ${s.fecha_deteccion ? `<span class="chip chip-baja">${escapeHTML(s.fecha_deteccion)}</span>` : ''}
      </div>
    </div>
    <div class="card-body">
      ${s.resumen ? `<div class="card-row"><span class="card-label">Resumen IA</span><span class="card-value">${escapeHTML(s.resumen)}</span></div>` : ''}
      ${s.proximo_paso ? `<div class="card-row"><span class="card-label">Paso sugerido</span><span class="card-value">${escapeHTML(s.proximo_paso)}</span></div>` : ''}
      ${s.fuente_url ? `<div class="card-row"><span class="card-label">Fuente</span><span class="card-value"><a href="${escapeHTML(s.fuente_url)}" target="_blank" rel="noopener">${escapeHTML(s.fuente_url)}</a></span></div>` : ''}
    </div>
    <div class="card-actions">
      <button class="btn red" data-action="reject" data-hash="${escapeHTML(s._hash)}">✕ No relevante</button>
      <button class="btn primary" data-action="edit" data-hash="${escapeHTML(s._hash)}">✏️ Editar y aprobar</button>
      <button class="btn green" data-action="approve-as-is" data-hash="${escapeHTML(s._hash)}">✓ Aprobar</button>
    </div>
  </div>`;
}

function renderMias() {
  const list = STATE.decisiones;
  const summaryHTML = `
    <div class="summary">
      <div class="summary-item"><span class="summary-label">Tu equipo</span><span class="summary-value">${escapeHTML(STATE.team || '—')}</span></div>
      <div class="summary-item"><span class="summary-label">Aprobadas</span><span class="summary-value">${list.filter(d => d.decision === 'approved').length}</span></div>
      <div class="summary-item"><span class="summary-label">Descartadas</span><span class="summary-value">${list.filter(d => d.decision === 'rejected').length}</span></div>
    </div>`;
  let body;
  if (list.length === 0) {
    body = `<div class="empty-state"><div class="icon">📋</div><h2>Sin decisiones aún</h2><p>Cuando aprobás o descartás sugerencias, aparecen acá.</p></div>`;
  } else {
    body = `<div class="cards">${list.map(renderDecision).join('')}</div>`;
  }
  document.getElementById('content').innerHTML = summaryHTML + body;
  wireEvents();
}

function renderDecision(d) {
  const isApproved = d.decision === 'approved';
  const fields = d.fields || {};
  const tool   = fields.herramienta || fields.titulo_original || '(sin nombre)';
  const subtitle = fields.titulo_original && fields.titulo_original !== tool ? fields.titulo_original : '';
  const date = d.decidedAt ? new Date(d.decidedAt).toLocaleString('es-AR') : '—';
  return `<div class="decision-card ${isApproved ? '' : 'rejected'}">
    <div class="decision-head">
      <div>
        <div class="decision-tool">${escapeHTML(tool)}</div>
        ${subtitle ? `<div class="card-title">${escapeHTML(subtitle)}</div>` : ''}
        <div class="decision-meta">${date}${d.bimestreDestino ? ' · ' + escapeHTML(d.bimestreDestino) : ''}</div>
      </div>
      <span class="decision-status ${isApproved ? 'approved' : 'rejected'}">${isApproved ? '✓ Aprobada' : '✕ Descartada'}</span>
    </div>
    ${isApproved ? `
      <div class="card-body">
        ${fields.queCambio     ? `<div class="card-row"><span class="card-label">Qué cambió</span><span class="card-value">${escapeHTML(fields.queCambio)}</span></div>` : ''}
        ${fields.nuevaPolitica ? `<div class="card-row"><span class="card-label">Nueva política</span><span class="card-value">${escapeHTML(fields.nuevaPolitica)}</span></div>` : ''}
        ${fields.deficiencia   ? `<div class="card-row"><span class="card-label">Deficiencia</span><span class="card-value">${escapeHTML(fields.deficiencia)}</span></div>` : ''}
        ${fields.responsable   ? `<div class="card-row"><span class="card-label">Responsable</span><span class="card-value">${escapeHTML(fields.responsable)}</span></div>` : ''}
        ${fields.proximoPaso   ? `<div class="card-row"><span class="card-label">Próximo paso</span><span class="card-value">${escapeHTML(fields.proximoPaso)}</span></div>` : ''}
      </div>` : ''}
  </div>`;
}

function wireEvents() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', async () => {
      STATE.activeTab = t.dataset.tab;
      await ensureLoaded(STATE.activeTab);
      render();
    });
  });
  const search = document.getElementById('searchInput');
  if (search) {
    search.addEventListener('input', e => {
      STATE.search = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const ni = document.getElementById('searchInput');
      if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); }
    });
  }
  const manualBtn = document.getElementById('manualBtn');
  if (manualBtn) {
    manualBtn.addEventListener('click', () => openModalAndPreFill(null, false));
  }
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', e => {
      const action = el.dataset.action;
      const hash = el.dataset.hash;
      const s = STATE.pendientes.find(x => x._hash === hash);
      if (!s) return;
      if (action === 'reject') return doReject(s);
      if (action === 'approve-as-is') return openModalAndPreFill(s, true);
      if (action === 'edit') return openModalAndPreFill(s, false);
    });
  });
}

function defaultBimestre() {
  // Por defecto: el bimestre/mes "actual o más cercano en el futuro" basado en hoy.
  // Si hoy es mayo, default = junio (el próximo período donde caería una novedad).
  if (STATE.bimestres.length === 0) return '';
  const today = new Date();
  const todayKey = today.getFullYear() * 100 + (today.getMonth() + 1);
  const future = STATE.bimestres.find(b => b.sortKey >= todayKey);
  return future ? future.sheet : STATE.bimestres[STATE.bimestres.length - 1].sheet;
}

// Helper: arma el HTML de un dropdown custom + un hidden input que guarda el valor.
function buildDropdownHTML(idPrefix, selectedValue, placeholder, options) {
  // options: [{ value, label }]
  const sel = options.find(o => o.value === selectedValue);
  const displayLabel = sel ? sel.label : (placeholder || '— elegí —');
  const isPlaceholder = !sel;
  const optsHTML = options.map(o =>
    `<div class="dropdown-option ${o.value === selectedValue ? 'selected' : ''}" data-value="${escapeHTML(o.value)}">${escapeHTML(o.label)}</div>`
  ).join('');
  return `<div class="dropdown" id="dd-${idPrefix}">
    <input type="hidden" id="f-${idPrefix}" value="${escapeHTML(selectedValue || '')}"/>
    <button type="button" class="dropdown-trigger ${isPlaceholder ? 'placeholder' : ''}" id="trg-${idPrefix}">${escapeHTML(displayLabel)}</button>
    <div class="dropdown-panel">${optsHTML}</div>
  </div>`;
}

function wireDropdown(idPrefix, onChange) {
  const root = document.getElementById('dd-' + idPrefix);
  if (!root) return;
  const trigger = document.getElementById('trg-' + idPrefix);
  const input   = document.getElementById('f-' + idPrefix);
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    const wasOpen = root.classList.contains('open');
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
    if (!wasOpen) root.classList.add('open');
  });
  root.querySelectorAll('.dropdown-option').forEach(opt => {
    opt.addEventListener('click', e => {
      e.stopPropagation();
      const val = opt.dataset.value;
      input.value = val;
      trigger.textContent = opt.textContent;
      trigger.classList.remove('placeholder');
      root.querySelectorAll('.dropdown-option.selected').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      root.classList.remove('open');
      if (typeof onChange === 'function') onChange(val);
    });
  });
}

// Cierra dropdowns al click afuera
document.addEventListener('click', () => {
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
});

const TIPO_OPTIONS = [
  { value: '',              label: '— sin clasificar —' },
  { value: 'politica',      label: 'política' },
  { value: 'funcionalidad', label: 'funcionalidad' },
  { value: 'precio',        label: 'precio' },
  { value: 'deprecacion',   label: 'deprecación' },
  { value: 'incidente',     label: 'incidente' },
];

function openModalAndPreFill(s, autoSubmit) {
  // s puede ser null → modo "agregar manualmente"
  const isManual = !s;
  MODAL.suggestion = s;
  MODAL.isManual = isManual;
  document.getElementById('modalTitle').textContent = isManual ? 'Agregar novedad manual' : s.herramienta;
  document.getElementById('modalSubtitle').textContent = isManual ? 'Nueva novedad · ' + STATE.team : 'Aprobar para ' + STATE.team;

  const bimOpts = STATE.bimestres.map(b => ({ value: b.sheet, label: b.label }));
  const catalogTools = (STATE.herramientasMiEquipo || []).map(t => ({ value: t, label: t }));

  // Si la sugerencia trae una herramienta que NO está en el catálogo del equipo,
  // la agregamos como opción extra al inicio del dropdown así el líder puede
  // aprobarla directamente con el nombre que detectó la IA. Si después la
  // quiere cambiar elige otra del catálogo o "Otra...".
  const suggestionTool = (!isManual && s) ? (s.herramienta || '').trim() : '';
  const isSuggestionToolInCatalog = !!suggestionTool && catalogTools.some(o => o.value === suggestionTool);
  const toolOpts = [];
  if (suggestionTool && !isSuggestionToolInCatalog) {
    toolOpts.push({ value: suggestionTool, label: suggestionTool });
  }
  toolOpts.push(...catalogTools);
  toolOpts.push({ value: '__custom__', label: '➕ Otra herramienta…' });

  // Default = la herramienta de la sugerencia (esté o no en catálogo).
  // En modo manual = primera del catálogo, o "Otra..." si el catálogo está vacío.
  const initialHerramienta = isManual
    ? ((catalogTools[0] && catalogTools[0].value) || '__custom__')
    : (suggestionTool || (catalogTools[0] && catalogTools[0].value) || '__custom__');
  const initialHerramientaCustom = '';

  const initialTipo  = isManual ? '' : (TIPO_OPTIONS.find(t => t.value === (s.tipo_cambio || '')) ? (s.tipo_cambio || '') : '');
  const initialBim   = defaultBimestre();

  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <div class="field">
      <label>Período destino (en qué hoja se carga)</label>
      ${buildDropdownHTML('bimestre', initialBim, 'Elegí un período', bimOpts)}
    </div>
    <div class="field">
      <label>Herramienta</label>
      ${buildDropdownHTML('herramienta', initialHerramienta, 'Elegí una herramienta', toolOpts)}
    </div>
    <div class="field" id="f-herramienta-custom-wrap" style="display:${initialHerramienta === '__custom__' ? 'flex' : 'none'};flex-direction:column;gap:5px">
      <label>Nombre de la nueva herramienta</label>
      <input type="text" id="f-herramienta-custom" value="${escapeHTML(initialHerramientaCustom)}" placeholder="Ej: Linear, Sentry, Mixpanel…"/>
    </div>
    <div class="field">
      <label>Qué cambió</label>
      <textarea id="f-queCambio">${escapeHTML(isManual ? '' : (s.titulo_original || ''))}</textarea>
    </div>
    <div class="field">
      <label>Nueva política / actualización</label>
      <textarea id="f-nuevaPolitica">${escapeHTML(isManual ? '' : (s.resumen || ''))}</textarea>
    </div>
    <div class="field">
      <label>Deficiencia / riesgo detectado</label>
      <textarea id="f-deficiencia"></textarea>
    </div>
    <div class="field">
      <label>Responsable</label>
      <input type="text" id="f-responsable" value="${escapeHTML(STATE.team)}"/>
    </div>
    <div class="field">
      <label>Próximo paso</label>
      <textarea id="f-proximoPaso">${escapeHTML(isManual ? '' : (s.proximo_paso || ''))}</textarea>
    </div>
    <div class="field">
      <label>Tipo de cambio</label>
      ${buildDropdownHTML('tipoCambio', initialTipo, 'Elegí tipo', TIPO_OPTIONS)}
    </div>
  `;
  wireDropdown('bimestre');
  wireDropdown('herramienta', val => {
    const wrap = document.getElementById('f-herramienta-custom-wrap');
    if (!wrap) return;
    wrap.style.display = val === '__custom__' ? 'flex' : 'none';
    if (val === '__custom__') {
      const inp = document.getElementById('f-herramienta-custom');
      if (inp) setTimeout(() => inp.focus(), 50);
    }
  });
  wireDropdown('tipoCambio');

  document.getElementById('modalApprove').textContent = isManual ? '✓ Agregar novedad' : '✓ Aprobar y enviar al Sheet';
  document.getElementById('editModal').classList.add('open');
  if (autoSubmit && !isManual) {
    document.getElementById('modalApprove').focus();
  }
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  MODAL.suggestion = null;
  MODAL.isManual = false;
}

async function doApproveFromModal() {
  const s = MODAL.suggestion;
  const isManual = MODAL.isManual;
  const btn = document.getElementById('modalApprove');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Enviando…';

  // Para una novedad manual generamos un hash único client-side.
  const hash = isManual
    ? 'manual-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8)
    : s._hash;

  let herramienta = (document.getElementById('f-herramienta').value || '').trim();
  if (herramienta === '__custom__') {
    const customInp = document.getElementById('f-herramienta-custom');
    herramienta = customInp ? customInp.value.trim() : '';
    if (!herramienta) {
      showToast('Escribí el nombre de la nueva herramienta', true);
      btn.disabled = false;
      btn.textContent = originalLabel;
      return;
    }
  }
  if (!herramienta) {
    showToast('Elegí una herramienta antes de aprobar', true);
    btn.disabled = false;
    btn.textContent = originalLabel;
    return;
  }
  const bimestre = (document.getElementById('f-bimestre').value || '').trim();
  if (!bimestre) {
    showToast('Elegí un período destino', true);
    btn.disabled = false;
    btn.textContent = originalLabel;
    return;
  }

  const body = {
    suggestionHash: hash,
    decision: 'approved',
    bimestreDestino: bimestre,
    herramienta,
    queCambio:       document.getElementById('f-queCambio').value.trim(),
    nuevaPolitica:   document.getElementById('f-nuevaPolitica').value.trim(),
    deficiencia:     document.getElementById('f-deficiencia').value.trim(),
    responsable:     document.getElementById('f-responsable').value.trim(),
    proximoPaso:     document.getElementById('f-proximoPaso').value.trim(),
    titulo_original: isManual ? '' : (s.titulo_original || ''),
    tipo_cambio:     (document.getElementById('f-tipoCambio') && document.getElementById('f-tipoCambio').value || '').trim(),
    relevancia:      isManual ? '' : ((s.relevancia || '').toLowerCase()),
    fuente_url:      isManual ? '' : (s.fuente_url || ''),
    manual:          isManual,
  };
  try {
    const r = await fetch('/api/lideres/decision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error al guardar');
    closeModal();
    let msg = isManual ? '✓ Novedad agregada al Sheet' : '✓ Aprobada y enviada al Sheet';
    if (data.n8n) {
      if (data.n8n.warning) msg = (isManual ? 'Guardada' : 'Aprobada') + ' (' + data.n8n.warning + ')';
      else if (data.n8n.error) msg = (isManual ? 'Guardada' : 'Aprobada') + ' local — Sheet falló: ' + data.n8n.error;
      else if (data.n8n.ok === false) msg = (isManual ? 'Guardada' : 'Aprobada') + ' local — Sheet respondió error (' + (data.n8n.status || '?') + ')';
    }
    showToast(msg, data.n8n && (data.n8n.error || data.n8n.ok === false));
    // Si era de la lista de pendientes, sacarla
    if (!isManual && s) {
      STATE.pendientes = STATE.pendientes.filter(x => x._hash !== s._hash);
    }
    STATE.loaded.mias = false; // forzar recarga la próxima vez
    render();
  } catch (err) {
    showToast(err.message || 'Error', true);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function doReject(s) {
  try {
    const r = await fetch('/api/lideres/decision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        suggestionHash: s._hash,
        decision: 'rejected',
        herramienta: s.herramienta,
        titulo_original: s.titulo_original,
      }),
    });
    if (!r.ok) throw new Error('Error al descartar');
    STATE.pendientes = STATE.pendientes.filter(x => x._hash !== s._hash);
    STATE.loaded.mias = false;
    showToast('Sugerencia descartada para tu equipo');
    render();
  } catch (err) {
    showToast(err.message || 'Error', true);
  }
}

// Theme toggle
function updateThemeIcon() {
  const t = document.documentElement.getAttribute('data-theme');
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const c = document.documentElement.getAttribute('data-theme');
  const n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem('theme', n);
  updateThemeIcon();
});
updateThemeIcon();

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  btn.disabled = true;
  try {
    STATE.loaded = { pendientes: false, mias: false };
    // Forzamos refresh de ambos tabs en background para que ambos counts queden actualizados.
    await Promise.all([loadPendientes(), loadMias()]);
    render();
    showToast('Actualizado');
  } catch (err) {
    showToast(err.message || 'Error al actualizar', true);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});

// Modal handlers
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalApprove').addEventListener('click', doApproveFromModal);
document.getElementById('editModal').addEventListener('click', e => {
  if (e.target.id === 'editModal') closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
